name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Run linters without --fix so CI fails instead of silently rewriting code.
      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (eslint)
        run: npx eslint .

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build-only

  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The backend does not exist yet; skip the job's steps until backend/ contains a project.
      - name: Detect backend
        id: detect
        run: |
          if [ -n "$(find backend -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' 2>/dev/null | head -1)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend project found in backend/, skipping."
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.detect.outputs.present == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: dotnet restore

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: dotnet test --no-build --configuration Release --verbosity normal
